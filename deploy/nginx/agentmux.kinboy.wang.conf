# OpenResty/Nginx reverse proxy for AgentMux Hub.
# Place this file in conf.d/ or include it from the http {} block.

map $http_upgrade $agentmux_connection_upgrade {
    default upgrade;
    ""      close;
}

upstream agentmux_hub {
    server 127.0.0.1:8081;
    keepalive 32;
}

server {
    listen 80;
    server_name agentmux.kinboy.wang;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name agentmux.kinboy.wang;

    include cert.conf;

    client_max_body_size 64m;

    location / {
        proxy_pass http://agentmux_hub;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $agentmux_connection_upgrade;

        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }
}
