services:
  hub:
    build:
      context: .
    image: agentmux:local
    restart: unless-stopped
    command:
      - hub
      - --addr
      - 0.0.0.0:8081
      - --data
      - /var/lib/agentmux/agentmux.db
      - --public-url
      - ${AGENTMUX_PUBLIC_URL:-http://127.0.0.1:8081}
    environment:
      AGENTMUX_TOKEN: ${AGENTMUX_TOKEN:-}
    ports:
      - "${AGENTMUX_BIND:-127.0.0.1:8081}:8081"
    volumes:
      - agentmux-data:/var/lib/agentmux

volumes:
  agentmux-data:
