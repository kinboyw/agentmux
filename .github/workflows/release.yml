name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
            ext: .exe
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/control/package-lock.json
      - name: Build web control
        working-directory: web/control
        run: |
          npm ci
          npm run build
          rm -rf ../../internal/hub/webdist
          mkdir -p ../../internal/hub/webdist
          cp -a dist/. ../../internal/hub/webdist/
      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          name="agentmux-${{ matrix.goos }}-${{ matrix.goarch }}"
          mkdir -p dist
          go build -trimpath -ldflags="-s -w" -o "dist/${name}${{ matrix.ext }}" ./cmd/agentmux
          cd dist
          tar -czf "${name}.tar.gz" "${name}${{ matrix.ext }}"
          sha256sum "${name}.tar.gz" > "${name}.tar.gz.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: agentmux-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            dist/*.tar.gz
            dist/*.sha256

  publish:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Resolve release notes
        id: notes
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME}"
          notes="docs/releases/${tag#v}.md"
          if [ ! -f "$notes" ]; then
            notes="docs/releases/${tag}.md"
          fi
          if [ -f "$notes" ]; then
            echo "path=$notes" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish release with curated notes
        if: steps.notes.outputs.path != ''
        uses: softprops/action-gh-release@v2
        with:
          body_path: ${{ steps.notes.outputs.path }}
          files: |
            dist/*.tar.gz
            dist/*.sha256
      - name: Publish release with generated notes
        if: steps.notes.outputs.path == ''
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/*.sha256
