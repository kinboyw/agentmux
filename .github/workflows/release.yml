name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - role: worker
            cmd: ./cmd/agentmux
            asset: agentmux-worker
            goos: linux
            goarch: amd64
          - role: worker
            cmd: ./cmd/agentmux
            asset: agentmux-worker
            goos: linux
            goarch: arm64
          - role: worker
            cmd: ./cmd/agentmux
            asset: agentmux-worker
            goos: darwin
            goarch: amd64
          - role: worker
            cmd: ./cmd/agentmux
            asset: agentmux-worker
            goos: darwin
            goarch: arm64
          - role: control
            cmd: ./cmd/agentmux
            asset: agentmux-control
            goos: linux
            goarch: amd64
          - role: control
            cmd: ./cmd/agentmux
            asset: agentmux-control
            goos: linux
            goarch: arm64
          - role: control
            cmd: ./cmd/agentmux
            asset: agentmux-control
            goos: darwin
            goarch: amd64
          - role: control
            cmd: ./cmd/agentmux
            asset: agentmux-control
            goos: darwin
            goarch: arm64
          - role: control
            cmd: ./cmd/agentmux
            asset: agentmux-tui
            goos: linux
            goarch: amd64
          - role: control
            cmd: ./cmd/agentmux
            asset: agentmux-tui
            goos: linux
            goarch: arm64
          - role: control
            cmd: ./cmd/agentmux
            asset: agentmux-tui
            goos: darwin
            goarch: amd64
          - role: control
            cmd: ./cmd/agentmux
            asset: agentmux-tui
            goos: darwin
            goarch: arm64
          - role: hub
            cmd: ./cmd/agentmux-hub
            asset: agentmux-hub
            goos: linux
            goarch: amd64
          - role: hub
            cmd: ./cmd/agentmux-hub
            asset: agentmux-hub
            goos: linux
            goarch: arm64
          - role: hub
            cmd: ./cmd/agentmux-hub
            asset: agentmux-hub
            goos: darwin
            goarch: amd64
          - role: hub
            cmd: ./cmd/agentmux-hub
            asset: agentmux-hub
            goos: darwin
            goarch: arm64
          - role: hub
            cmd: ./cmd/agentmux-hub
            asset: agentmux-hub
            goos: windows
            goarch: amd64
            ext: .exe
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/control/package-lock.json
      - name: Build web control
        working-directory: web/control
        run: |
          npm ci
          npm run build
          rm -rf ../../internal/hub/webdist
          mkdir -p ../../internal/hub/webdist
          cp -a dist/. ../../internal/hub/webdist/
      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          name="${{ matrix.asset }}-${{ matrix.goos }}-${{ matrix.goarch }}"
          binary="${name}${{ matrix.ext }}"
          version="${GITHUB_REF_NAME}"
          commit="${GITHUB_SHA::12}"
          build_time="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          ldflags="-s -w -X private/agentmux/internal/version.Version=${version} -X private/agentmux/internal/version.Commit=${commit} -X private/agentmux/internal/version.BuildTime=${build_time}"
          mkdir -p dist
          go build -trimpath -ldflags="${ldflags}" -o "dist/${binary}" "${{ matrix.cmd }}"
          cd dist
          tar -czf "${name}.tar.gz" "${binary}"
          sha256sum "${name}.tar.gz" > "${name}.tar.gz.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            dist/*.tar.gz
            dist/*.sha256

  publish:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Resolve release notes
        id: notes
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME}"
          notes="docs/releases/${tag#v}.md"
          if [ ! -f "$notes" ]; then
            notes="docs/releases/${tag}.md"
          fi
          if [ -f "$notes" ]; then
            echo "path=$notes" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish release with curated notes
        if: steps.notes.outputs.path != ''
        uses: softprops/action-gh-release@v2
        with:
          body_path: ${{ steps.notes.outputs.path }}
          files: |
            dist/*.tar.gz
            dist/*.sha256
      - name: Publish release with generated notes
        if: steps.notes.outputs.path == ''
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/*.sha256

  docker:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
